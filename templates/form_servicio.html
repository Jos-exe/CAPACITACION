{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">{% if servicio %}Editar Servicio{% else %}Nuevo Servicio{% endif %}</h2>

    <form method="POST">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del Servicio</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ servicio.nombre if servicio else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" id="precio" name="precio" value="{{ servicio.precio if servicio else '' }}" required>
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('servicios') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
