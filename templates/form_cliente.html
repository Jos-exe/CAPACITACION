{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">{% if cliente %}Editar Cliente{% else %}Nuevo Cliente{% endif %}</h2>

    <form method="POST">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del Cliente</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ cliente.nombre if cliente else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="text" class="form-control" id="telefono" name="telefono" value="{{ cliente.telefono if cliente else '' }}" required>
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('clientes') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
