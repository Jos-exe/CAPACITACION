{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h1 class="mb-3">Citas</h1>

    <a href="{{ url_for('nueva_cita') }}" class="btn btn-success mb-3">Nuevo</a>

    <table class="table table-striped table-bordered align-middle shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Id</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Servicio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for cita in citas %}
            <tr>
                <td>{{ cita.id }}</td>
                <td>{{ cita.fecha }}</td>
                <td>{{ cita.cliente }}</td>
                <td>{{ cita.servicio }}</td>
                <td>
                    <form action="{{ url_for('eliminar_cita', id=cita.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
