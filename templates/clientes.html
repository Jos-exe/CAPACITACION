{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h1 class="mb-3">Lista de Clientes</h1>

    <a href="{{ url_for('nuevo_cliente') }}" class="btn btn-success mb-3">Nuevo Cliente</a>

    <table class="table table-striped table-bordered align-middle shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for cliente in clientes %}
            <tr>
                <td>{{ cliente.id }}</td>
                <td>{{ cliente.nombre }}</td>
                <td>{{ cliente.telefono }}</td>
                <td>
                    <a href="{{ url_for('editar_cliente', id=cliente.id) }}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{{ url_for('eliminar_cliente', id=cliente.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar este cliente?');">Eliminar</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="text-center text-muted">No hay clientes registrados todavía.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
